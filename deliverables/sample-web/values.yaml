# Lite values. The image is an example registry path, not a published image.
replicaCount: 2
image:
  repository: registry.example.com/sample-web
  tag: "1.0.0"
  pullPolicy: IfNotPresent
containerPort: 8080
probePath: /healthz
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi
